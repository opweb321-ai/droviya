<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dr. Oviyaa P — Patient Reviews</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Minimal page (use your existing page structure if preferred) -->
  <section class="bg-gradient-to-r from-pink-600 to-rose-700 text-white py-16">
    <div class="container mx-auto px-6 text-center">
      <h1 class="text-3xl font-bold">Dr. Oviyaa P — Patient Reviews</h1>
      <p class="mt-2 text-pink-100">Submit a review. See reviews update instantly.</p>
    </div>
  </section>

  <main class="container mx-auto px-6 py-10 max-w-4xl">
    <div class="bg-white rounded-lg shadow p-6 mb-8">
      <form id="reviewForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Your name</label>
          <input id="patientName" type="text" required class="w-full mt-1 p-3 border rounded" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Rating</label>
          <div id="starRating" class="flex gap-2 mt-1">
            <button type="button" class="star text-2xl" data-rating="1">☆</button>
            <button type="button" class="star text-2xl" data-rating="2">☆</button>
            <button type="button" class="star text-2xl" data-rating="3">☆</button>
            <button type="button" class="star text-2xl" data-rating="4">☆</button>
            <button type="button" class="star text-2xl" data-rating="5">☆</button>
          </div>
          <input id="ratingValue" name="rating" type="hidden" value="0" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Review</label>
          <textarea id="reviewMessage" rows="4" required class="w-full mt-1 p-3 border rounded"></textarea>
        </div>

        <div>
          <button id="submitBtn" type="submit" class="w-full bg-pink-600 text-white p-3 rounded">
            Submit Review
          </button>
        </div>
      </form>
    </div>

    <section>
      <h2 class="text-xl font-semibold mb-4">Patient Reviews</h2>
      <div id="reviewsContainer" class="space-y-4"></div>
    </section>
  </main>

  <!-- Firebase + App logic -->
  <script type="module">
    // 1) Firebase SDK imports (modular)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp,
      query,
      orderBy,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    // 2) Your provided config
    const firebaseConfig = {
      apiKey: "AIzaSyBcNRA51BQT7Z0-tgyL1tujJuG--7Skf7M",
      authDomain: "oviyaa.firebaseapp.com",
      projectId: "oviyaa",
      storageBucket: "oviyaa.firebasestorage.app",
      messagingSenderId: "846903640849",
      appId: "1:846903640849:web:ec6b0b0fd04c97ac4bc2b0",
      measurementId: "G-Z3M6BY5HBT"
    };

    // 3) Init
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 4) DOM
    const form = document.getElementById('reviewForm');
    const nameInput = document.getElementById('patientName');
    const ratingInput = document.getElementById('ratingValue');
    const messageInput = document.getElementById('reviewMessage');
    const submitBtn = document.getElementById('submitBtn');
    const reviewsContainer = document.getElementById('reviewsContainer');
    const stars = document.querySelectorAll('.star');

    // 5) Star rating UI
    function renderStars(selected) {
      stars.forEach(s => {
        const r = Number(s.dataset.rating);
        s.textContent = r <= selected ? '★' : '☆';
        s.classList.toggle('text-yellow-500', r <= selected);
      });
    }
    stars.forEach(s => {
      s.addEventListener('click', () => {
        const val = Number(s.dataset.rating);
        ratingInput.value = val;
        renderStars(val);
      });
    });

    // 6) Submit review to Firestore
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      const rating = Number(ratingInput.value) || 0;
      const message = messageInput.value.trim();

      if (!name) {
        alert('Please enter your name.');
        return;
      }
      if (rating < 1 || rating > 5) {
        alert('Please select a rating (1-5).');
        return;
      }
      if (!message) {
        alert('Please write a review.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';

      try {
        await addDoc(collection(db, 'reviews'), {
          name,
          rating,
          message,
          timestamp: serverTimestamp()
        });
        // clear form
        nameInput.value = '';
        ratingInput.value = '0';
        messageInput.value = '';
        renderStars(0);
      } catch (err) {
        console.error('Write failed', err);
        alert('Failed to submit. Check console.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Review';
      }
    });

    // 7) Real-time listener: show newest first
    const reviewsQuery = query(collection(db, 'reviews'), orderBy('timestamp', 'desc'));
    onSnapshot(
      reviewsQuery,
      (snapshot) => {
        reviewsContainer.innerHTML = '';
        snapshot.forEach(doc => {
          const data = doc.data();
          // Build review element safely using textContent
          const wrapper = document.createElement('div');
          wrapper.className = 'bg-white p-4 rounded shadow';

          const top = document.createElement('div');
          top.className = 'flex items-center justify-between mb-2';
          const who = document.createElement('div');
          who.className = 'font-semibold';
          who.textContent = data.name || 'Anonymous';

          const meta = document.createElement('div');
          meta.className = 'text-sm text-gray-500';
          // timestamp may be null for very new writes; handle gracefully
          try {
            meta.textContent = data.timestamp && data.timestamp.toDate
              ? data.timestamp.toDate().toLocaleString()
              : '';
          } catch (e) {
            meta.textContent = '';
          }

          top.appendChild(who);
          top.appendChild(meta);

          const ratingRow = document.createElement('div');
          ratingRow.className = 'mb-2';
          const r = Number(data.rating) || 0;
          ratingRow.textContent = 'Rating: ' + '★'.repeat(r) + '☆'.repeat(5 - r);

          const msg = document.createElement('div');
          msg.className = 'text-gray-700';
          msg.textContent = data.message || '';

          wrapper.appendChild(top);
          wrapper.appendChild(ratingRow);
          wrapper.appendChild(msg);

          reviewsContainer.appendChild(wrapper);
        });

        if (snapshot.empty) {
          reviewsContainer.innerHTML = '<div class="text-gray-500">No reviews yet.</div>';
        }
      },
      (err) => {
        console.error('Realtime error', err);
        reviewsContainer.innerHTML = '<div class="text-red-600">Could not load reviews.</div>';
      }
    );
  </script>
</body>
</html>
